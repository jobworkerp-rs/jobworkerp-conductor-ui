# cargo-about settings for the Rust crates compiled into the UI's WebAssembly
# modules (scripts/generate-third-party-licenses.ts).
#
# Only the licenses below may appear in a release, for the JavaScript packages
# too (scripts/lib/licenses.ts reads this list). A dependency under any other
# license fails the listing, and with it CI and the public release, so adding
# one is a deliberate review of this list. Earlier entries are preferred when
# a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]

targets = ["wasm32-unknown-unknown"]
# Only what is compiled into the modules is shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# This project's own crates (publish = false) are covered by LICENSE.
private = { ignore = true }
